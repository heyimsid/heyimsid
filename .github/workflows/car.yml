name: Generate Car Contribution Grid

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: "0 */12 * * *"
  
  # Allows manual trigger anytime from the Actions tab
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Car Grid SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: heyimsid
          outputs: |
            dist/github-car-grid.svg?color_snake=#FF0033&color_dots=#0d1117,#003b00,#006b00,#00b300,#22c55e
            dist/github-car-grid-dark.svg?color_snake=#00FF66&color_dots=#0d1117,#003b00,#006b00,#00b300,#22c55e

      - name: Push generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}