xml:space:preserve;
}

.title{
font-size:13px;
font-weight:600;
}

.line{
opacity:0;
animation:fade .35s forwards;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(2px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

